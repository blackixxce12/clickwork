# Builds and tests the Linux half, and then runs it against a real compositor.
#
# The second part is the reason this file exists. The suite is green on a machine
# with no Wayland session at all - which sounds like good news and is the opposite:
# not one of those tests touches a compositor, so none of them could notice a
# protocol binding wrongly or a capture coming back the wrong size. `--selftest
# session` is pointed at a headless sway here, which is the only place the
# compositor-facing code is exercised by anything but a person.
#
# Hyprland, the compositor this program actually supports, cannot run here at all:
# it needs a DRM node and fails at `CBackend::create()` without one. That was
# control-tested rather than assumed. So CI covers the portable wlroots protocols
# and the Hyprland-specific paths stay the responsibility of a human on a real
# session - which is worth knowing when reading a green tick on this workflow.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-debug

      - name: Install what the build links against
        # Only libxkbcommon: everything else this program speaks to is opened at
        # run time rather than linked. `ldd` on the shipped binary lists libc,
        # libm, libgcc and libxkbcommon and nothing else, which is why the package
        # has to name its dlopened dependencies by hand.
        #
        # The CJK font is not for the build - it is for the tests, and it is not
        # optional. `font_definitions()` adds a system CJK font to the embedded set,
        # so the font stack genuinely differs from machine to machine, and the glyph
        # check measures a character against the replacement box a font draws for
        # codepoints nothing covers. With no CJK font there is no box to compare
        # against: the shaper drops those codepoints instead of drawing them, and the
        # check would answer "draws fine" to everything, boxes included. That is the
        # first thing this workflow caught.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev fonts-noto-cjk

      # Deliberately no `cargo fmt --check`. This tree is not formatted by plain
      # rustfmt and is not meant to be: running it rewrites some seventeen thousand
      # lines of `main.rs` alone, which would bury every real diff this workflow
      # exists to protect. If a formatting gate is ever wanted it needs a
      # `rustfmt.toml` matching the house style first, and a single commit to
      # convert - not a CI step that fails on arrival.

      - name: Test
        # 315 of them at the time of writing, and none needs a compositor.
        run: cargo test

      - name: Build
        # Debug on purpose. The session job below only asks this binary which
        # protocols it can bind, and the release profile asks for fat LTO with one
        # codegen unit - minutes of a runner's time for an answer that does not
        # depend on any of it. The release profile is checked in its own job.
        run: cargo build

      - uses: actions/upload-artifact@v4
        with:
          name: clickwork-debug
          path: target/debug/clickwork
          if-no-files-found: error
          retention-days: 7

  session:
    name: Against a headless compositor
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: clickwork-debug
          path: bin

      - name: Install a compositor to run against
        # sway rather than Hyprland, for the reason at the top of this file.
        # Ubuntu 24.04 carries sway 1.9 on wlroots 0.17, which offers every
        # protocol this program uses today - the virtual pointer and keyboard,
        # screencopy, layer-shell, viewporter and data-control - but none of the
        # `ext_*` successors, which need a newer sway than any runner image has.
        #
        # Tesseract is here so the doctor exercises the dlopen path rather than
        # reporting it missing: the library is opened by name at run time
        # (`libtesseract.so.5`), so nothing at build time would catch that going
        # wrong. wl-clipboard is not needed - the clipboard is spoken in-process.
        run: |
          sudo apt-get update
          sudo apt-get install -y sway tesseract-ocr tesseract-ocr-eng
          sway --version
          chmod +x bin/clickwork

      - name: What this session can do, and whether the code agrees
        # The gate. Every capability is asked twice - is the protocol advertised,
        # and does the feature on top of it work - and a disagreement either way
        # round fails the job. A feature that quietly does nothing is the bug this
        # is here to catch; it has happened before and shipped.
        run: ci/headless-session.sh bin/clickwork --selftest session

      - name: The doctor's screen, for the record
        # Not a gate: `--doctor` reports and always exits 0, and most of what it
        # reports is legitimately absent on a runner - no Hyprland, no input
        # devices, no tray, no portal. It is here because the log then says exactly
        # what a headless sway offered on the day, which is the only record of that
        # anyone has, and because a crash in it would still fail the step.
        run: ci/headless-session.sh bin/clickwork --doctor

  packages:
    name: .deb and .rpm
    needs: test
    # This one does run on pull requests, unlike the release build below, and it
    # costs a fat-LTO build to do so. The reason is the standing rule that an
    # untested package is no package: a pull request is where a change to the
    # packaging is looked at, and a job that only ran after the merge would be
    # reporting on something nobody could still refuse.
    runs-on: ubuntu-latest
    # Bookworm, and the choice is load-bearing rather than incidental. The glibc
    # floor of the binary is a property of the machine it was built on, and
    # bookworm's 2.36 is old enough that `pidfd_spawnp` does not exist in it, so
    # no reference to it is created and the floor falls to 2.35 - which reaches
    # Ubuntu 22.04 and Debian 12. Trixie would leave the floor at 2.39 and cut
    # both off. The runner itself would leave it at 2.43, which nothing ships.
    #
    # One binary goes into both packages. glibc is backward compatible, and the
    # four libraries this links against have the same soname everywhere, so
    # there is no distribution-specific linking to preserve.
    container: debian:bookworm
    steps:
      # Before checkout: the image has neither git nor curl, and actions/checkout
      # falls back to a tarball download without git.
      - name: What the build needs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential pkg-config \
            libxkbcommon-dev dpkg-dev
          # dpkg-dev is what provides dpkg-shlibdeps. Without it cargo-deb's
          # `$auto` degrades to a warning and the Depends field silently loses
          # libc6 and libxkbcommon0, with the build still green. There is a step
          # below that checks the result rather than trusting this line.

      - uses: actions/checkout@v4

      - name: Rust
        # rustup rather than the distribution's rustc: bookworm ships 1.63, and
        # Cargo.toml asks for 1.98 and edition 2024.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: bookworm-release

      - name: The packaging tools
        # Pinned to the versions the metadata in Cargo.toml was actually built
        # and taken apart with. cargo-deb refuses an unknown key outright, and
        # cargo-generate-rpm is a 0.x crate where `^0.16` would mean "below
        # 0.17" and quietly fetch something else entirely.
        run: |
          cargo install cargo-deb --locked --version '^3.8'
          cargo install cargo-generate-rpm --locked --version '^0.21'

      - name: Build
        run: cargo build --release --locked

      - name: The glibc floor
        # The gate. `packaging/glibc-floor` carries the decision and the table of
        # what each floor costs; this only compares against it. Printing the
        # number without comparing would let a build raise the floor silently,
        # which is exactly how a package comes to install and then not start.
        run: |
          max=$(grep -v '^#' packaging/glibc-floor | tr -d '[:space:]')
          got=$(objdump -T target/release/clickwork \
                | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "allowed at most $max, this build needs $got"
          if [ "$max" != "$got" ] && \
             [ "$(printf '%s\n%s\n' "$max" "$got" | sort -V | tail -1)" = "$got" ]; then
            echo "::error::the glibc floor rose to $got, above $max"
            echo "what holds it up:"
            objdump -T target/release/clickwork | grep -F "($got)"
            exit 1
          fi

      - name: Build the packages
        run: |
          cargo deb --no-build
          cargo generate-rpm

      - name: $auto actually ran
        # The silent failure this guards against has already happened once, on a
        # developer machine with no dpkg-shlibdeps: the package built, stayed
        # green, and shipped a Depends field with no libc in it.
        run: |
          deps=$(dpkg-deb -f target/debian/clickwork_*.deb Depends)
          echo "$deps"
          echo "$deps" | grep -q 'libc6' || { echo '::error::no $auto deps'; exit 1; }
          echo "$deps" | grep -q 'libxkbcommon0' || { echo '::error::no xkbcommon'; exit 1; }

      - name: What is inside
        run: |
          dpkg-deb -c target/debian/clickwork_*.deb
          dpkg-deb -c target/debian/clickwork_*.deb \
            | grep -q 'usr/lib/udev/rules.d/70-clickwork-input.rules' \
            || { echo '::error::the udev rule is missing, so recording will not work'; exit 1; }

      - name: The plain tarball
        # For distributions with no package of their own. It carries the same
        # binary as the other two - same container, same glibc floor - plus
        # everything a package would have installed, and `install.sh` to put it
        # where it goes. Unpacking it is enough to run the program on most
        # compositors and is *not* enough on KDE, where KWin hands out its window
        # protocol only to a client an installed desktop file names; install.sh
        # writes that file, which is why it is in here rather than a bare binary.
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          d="clickwork-$v-x86_64-linux"
          mkdir -p "$d"
          cp target/release/clickwork "$d/"
          cp install.sh "$d/"
          cp packaging/arch/70-clickwork-input.rules "$d/"
          cp packaging/arch/io.github.blackixxce12.clickwork.desktop "$d/"
          mkdir -p "$d/icons"
          cp assets/icon_128.png assets/icon_256.png assets/icon_512.png "$d/icons/"
          cp README.md README_RU.md LINUX.md LINUX_RU.md SCRIPTS.md SCRIPTS_RU.md \
             PLATFORMS.md PLATFORMS_RU.md CHANGELOG.md LICENSE "$d/"
          tar -czf "$d.tar.gz" "$d"
          echo "TARBALL=$d.tar.gz" >> "$GITHUB_ENV"
          tar -tzf "$d.tar.gz" | head -20

      - name: Gather them in one place
        # Not two paths in the upload below. `upload-artifact` keeps the
        # structure relative to the common ancestor of the paths it is given, so
        # `target/debian/*.deb` plus `target/generate-rpm/*.rpm` arrives as
        # `debian/…` and `generate-rpm/…` rather than as two files - and the job
        # that installs it then looks in the wrong directory and fails on a glob
        # that matched nothing. One directory, one level, no rule to remember.
        #
        # `release-artifacts`, and NOT `dist`: the repository already tracks a
        # `dist/` holding a `Clickwork.msi` from an earlier release, so
        # `mkdir -p dist` landed in it and `path: dist/*` swept that stale
        # installer into the packaging artifact. It was caught by looking in the
        # downloaded artifact rather than at the list of files copied into it,
        # one step before it would have been published over a Windows build that
        # had deliberately not been rebuilt. The directory is removed first so a
        # rerun on a warm runner cannot carry anything over either.
        run: |
          rm -rf release-artifacts
          mkdir -p release-artifacts
          cp target/debian/*.deb target/generate-rpm/*.rpm release-artifacts/
          cp clickwork-*-x86_64-linux.tar.gz release-artifacts/
          ls -l release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: clickwork-packages
          path: release-artifacts/*
          if-no-files-found: error

  install-deb:
    name: Install the .deb and run it
    needs: packages
    runs-on: ubuntu-latest
    # A virgin Debian, deliberately not the same image the package was built in:
    # a build image has the build dependencies installed and would hide a missing
    # runtime one.
    container:
      image: debian:trixie
      # sway needs no /dev/dri and no privileges - with WLR_BACKENDS=headless
      # wlroots never creates a session, so libseat, logind and /dev/input are
      # all out of the picture - but Docker's default 64 MiB /dev/shm is small
      # for a compositor and its client.
      options: --shm-size=512m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: clickwork-packages
          path: pkg

      - name: Install it, and let apt resolve what it declared
        # `apt-get install ./file.deb` puts the package in the cache like any
        # other and runs its Depends through the ordinary resolver, so a
        # dependency named wrongly fails here. `dpkg -i` would not: it unpacks
        # and leaves the package unconfigured. This step is the reason the whole
        # job exists.
        run: |
          ls -l pkg
          apt-get update
          apt-get install -y ./pkg/clickwork_*.deb

      - name: It starts
        # Before sway is anywhere near this container. Installing a compositor
        # first would drag in half the missing dependencies and mask them.
        run: |
          clickwork --version
          test -f /usr/lib/udev/rules.d/70-clickwork-input.rules

      - name: The recommendations are real names too
        # apt does not fail on an unsatisfiable Recommends - it is not an
        # important dependency to the resolver, so it is quietly dropped. These
        # are the hardest names to get right and would otherwise be the only
        # ones nothing checks.
        run: apt-get install -y libtesseract5 tesseract-ocr-eng fonts-noto-cjk

      - name: Against a compositor, as an installed program
        # The same two commands the source tree runs, against the binary that
        # came out of the package rather than out of target/.
        run: |
          apt-get install -y --no-install-recommends sway
          # Through bash by name rather than by its executable bit: without git
          # in the image, actions/checkout unpacks a tarball instead of cloning,
          # and a lost mode bit would fail here for a reason that has nothing to
          # do with the package being tested.
          bash ci/headless-session.sh clickwork --selftest session
          bash ci/headless-session.sh clickwork --doctor

  release:
    name: The profile that ships
    # Only where it is worth the minutes. Fat LTO with a single codegen unit takes
    # far longer than the debug build, and it is run here to catch the things that
    # only the release profile catches rather than to gate every push to a branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-release

      - name: Install what the build links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev

      - name: Build
        run: cargo build --release

      - name: What it links against
        # The packaging audit's list, re-checked on every release build: anything
        # new appearing here is a dependency the Arch package does not declare.
        run: ldd target/release/clickwork
