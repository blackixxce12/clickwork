[package]
name = "clickwork"
version = "2.0.0"
edition = "2024"
rust-version = "1.98.0"
# One line, and under eighty characters, because this is also the Debian
# package's synopsis: cargo-deb takes it verbatim and wraps anything longer
# across several lines, which is not what a Description field's first line is
# allowed to be. The detail that used to live here is in the extended
# description further down, where it belongs.
description = "Macro recorder for Windows and Wayland, recording into image-matched steps"
license = "MIT"
build = "build.rs"

[features]
# OCR through Windows.Media.Ocr: no models to ship, uses the language packs already
# installed in Windows. On by default; if it ever fails to build, everything else
# still works with --no-default-features.
default = ["winocr", "tesseract"]
winocr = []
# OCR through Tesseract on Linux. The library is opened at run time (dlopen), so a
# machine without it still starts and only the text steps report "install
# tesseract". Nothing is linked at build time and no models are shipped: the
# `tesseract-data-*` packages already on the machine are what is read.
tesseract = []
# Development only, never in a release. Compiles egui's inspection protocol so the
# running UI can be read and driven from outside; it costs about 800 KB. It is
# deliberately not part of `default`, so `cargo build --release` cannot pick it up by
# accident: the file that goes on GitHub must never carry a debug port. Build the
# inspect copy into its own target directory, which keeps it from overwriting the
# shipped binary and keeps either build from invalidating the other's cache:
#
#   cargo build --release --features inspect --target-dir target/inspect
#   cp target/inspect/release/clickwork.exe target/inspect/release/MacroInspect.exe
#
# then run MacroInspect.exe with EGUI_INSPECTION=1. The rename is a copy rather than a
# second [[bin]] target on purpose: two targets sharing one src/main.rs make cargo warn
# on every command, including the release build, which is too high a price for a tool
# only ever used here.
inspect = ["eframe/inspection"]

[dependencies]
# GUI & Serialization
# `inspection` is deliberately absent here. It is reachable through the optional
# `inspect` feature above, which is how the MacroInspect copy is built; leaving it
# out of this list is what keeps the shipped binary free of a debug port.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.36"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
flate2 = "1.1.9"
# PNG only: templates are loaded from and saved as ordinary images so users can
# crop them in any editor. No other codecs are pulled in.
image = { version = "0.25", default-features = false, features = ["png"] }

# Concurrency & Timing
crossbeam-channel = "0.5.16"
parking_lot = "0.12.5"
spin_sleep = "1.3.3"

# Error Handling & Logging
anyhow = "1.0.104"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "std"] }
tracing-appender = "0.2.5"

# Utilities
rfd = "0.17.2"

# Removed vs the previous draft:
#   bincode-next - the gzip+JSON path already gives ~20-40x compression while staying
#                  hand-editable and diffable, which is a selling point of this project.
#                  Swap point if you still want it: `save_macro` / `load_macro` in main.rs.
#   rand         - the only randomness needed is playback jitter; main.rs ships a
#                  12-line xorshift64* generator instead (deterministic and unit-tested).

# Linux: the Wayland compositor is the whole platform. Nothing here is linked
# against a desktop toolkit; the window comes from eframe as before, and the rest
# is Wayland protocols (virtual pointer and keyboard for playback, screencopy for
# the picture search, layer-shell for the overlay), Hyprland's IPC socket for
# window geometry and focus, evdev for recording, and D-Bus for the tray icon,
# notifications, AT-SPI (the UI Automation equivalent) and the global-shortcut
# portal. Tesseract is loaded at run time through `libloading`, see the feature.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
libloading = "0.8"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# KWin's own window protocol. Already in the lock file as a transitive
# dependency, and winit already turns on its `client` feature, so naming it
# here costs nothing at build time.
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.9", default-features = false }
evdev = "0.13"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }
wl-clipboard-rs = "0.9"
ab_glyph = "0.2"

# Embeds assets/icon.ico into the .exe (Explorer / taskbar icon).
# Requires a resource compiler: rc.exe from the Windows SDK (MSVC) or windres.exe (GNU).
# If it is missing the build still succeeds - you just get a warning and no exe icon.
#
# Not gated on `cfg(windows)`: a build-dependency's cfg is the *host*, so gating it
# there would drop the icon from every Windows executable cross-built from elsewhere.
# `build.rs` asks about the target instead, and does nothing when that is not Windows.
[build-dependencies]
winresource = "0.1"

# Windows API Bindings
[target.'cfg(windows)'.dependencies]
known-folders = "1.3"   # moved here: this crate is Windows-only
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_SystemInformation", # GetLocalTime for the scheduler
    "Win32_System_DataExchange",    # clipboard
    "Win32_System_Memory",          # GlobalLock for the clipboard DIB
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # Desktop Duplication. GDI's BitBlt out of the composited desktop is a fixed
    # ~6 ms readback whatever the region size (measured: --selftest vision, "Where a
    # capture goes"), and no arrangement of DCs or bitmaps moves it. These are the
    # bindings for the path that does.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_System_Shutdown",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Power",
    # WinRT namespaces for OCR. Harmless when the winocr feature is off - they only
    # add bindings, never code.
    "Globalization",
    "Media_Ocr",
    "Graphics_Imaging",
    "Security_Cryptography",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Accessibility",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[profile.release]
# Speed, not size. Measured on this project, same source, interleaved on a quiet
# machine: the image search runs at 22 ms under "z" and 11 ms under 3 - the single
# largest performance lever in the program, and it is worth 1.7 MB. The capture path
# does not move, because it waits on the GPU rather than on arithmetic.
opt-level = 3
lto = true
codegen-units = 1
strip = true
# B7: panic = "abort" is kept for size and predictability. catch_unwind is useless under
# abort, so it was removed from the hook callbacks entirely; those paths are now written
# to be panic-free (null-pointer guards, no unwrap, no slice indexing).
panic = "abort"



# ---------------------------------------------------------------------------
# The Debian package. `cargo deb` builds it; the result lands in
# target/debian/clickwork_2.0.0-1_amd64.deb.
#
# Build it in `debian:bookworm` and nowhere else. The glibc floor is a property
# of the build host rather than of the program - a build on this development
# machine needs GLIBC_2.43, which nothing ships - and bookworm's 2.36 is the
# oldest that still gives a floor low enough for Ubuntu 22.04 and Debian 12.
# See BUILDING.md.
# ---------------------------------------------------------------------------
[package.metadata.deb]
name = "clickwork"
maintainer = "blackixxce12 <blackixxce12@users.noreply.github.com>"
copyright = "2026, blackixxce12"
# The second element is a string rather than a number - a number does not
# deserialise. `/usr/share/doc/clickwork/copyright` is generated from this, so
# the PKGBUILD's `/usr/share/licenses/...` line is not transcribed below.
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
revision = "1"

# Not optional. Without it cargo-deb puts the whole of README.md - ninety
# kilobytes - into the control file's Description field.
extended-description = """
Clickwork records the mouse and the keyboard from the input devices themselves, \
which on Wayland is the only way to see input aimed at other applications, and \
replays them. A recording is not blind coordinate playback: a step can be \
anchored to a picture on the screen or to text read out of it, so a macro \
survives a window that moved.

Playback goes through the virtual-pointer and virtual-keyboard protocols, the \
picture search through wlr-screencopy, and the overlay through layer-shell. \
Hyprland is the supported compositor and answers every question about windows \
through its own IPC; on other wlroots compositors the portable \
foreign-toplevel protocol answers what it can and the program says plainly \
what it cannot.

Recording needs read access to /dev/input/event*. The udev rule in this \
package grants it to the user seated at the machine, so nobody has to be put \
in the input group. Devices already plugged in pick the rule up at the next \
login, or at once after `udevadm trigger --subsystem-match=input`.

Text recognition is optional: libtesseract is opened at run time, and without \
it everything works except the steps that read text."""

# `$auto` runs dpkg-shlibdeps, which sees exactly the two libraries this binary
# links - libc6 and libxkbcommon0 - and nothing else, because everything else
# is opened with dlopen. It also needs `dpkg-dev` present, and when that is
# missing it degrades to a warning rather than an error, so CI checks the
# result. The rest of this list was measured by running the program under
# `LD_DEBUG=libs` and reading which libraries it actually opened.
depends = [
    "$auto",
    # Every Wayland protocol the program speaks.
    "libwayland-client0",
    # `wl_egl_window_create`. Part of the `wayland` package on Arch, which is
    # why the PKGBUILD does not name it; here it is its own package, and
    # without it the window never gets an EGL surface.
    "libwayland-egl1",
    # libEGL.so.1, through glutin. Not `libgl1`: that is the GLX path, which is
    # X11's, and a live Wayland session never opens it.
    "libegl1",
    # libdbus-1.so.3, opened by rfd for the file-dialog portal. The tray,
    # notifications and AT-SPI do not need it - zbus speaks the protocol itself
    # - but the file dialogs do.
    "libdbus-1-3",
    # A session bus for the tray, notifications, AT-SPI and the portal.
    "default-dbus-session-bus | dbus-session-bus",
    "at-spi2-core",
    "xdg-desktop-portal",
    # For the `fc-match` binary, not for the library: that is how a CJK font is
    # found when none of the hardcoded paths exists.
    "fontconfig",
]

recommends = [
    # Opened at run time. Without it everything works except the text steps.
    "libtesseract5",
    # Tesseract initialises and then fails without language data.
    "tesseract-ocr-eng",
    # The Chinese interface, and the glyph check the test suite runs.
    "fonts-noto-cjk",
]

suggests = [
    # The supported compositor: window geometry, anchoring, workspace
    # isolation, hide-to-tray and compositor-level hotkeys.
    "hyprland",
    "xdg-desktop-portal-hyprland",
    "xdg-desktop-portal-wlr",
    "xdg-desktop-portal-gnome",
    "xdg-desktop-portal-kde",
    # Debian writes chi-sim with a hyphen where Fedora writes chi_sim.
    "tesseract-ocr-rus",
    "tesseract-ocr-ukr",
    "tesseract-ocr-por",
    "tesseract-ocr-spa",
    "tesseract-ocr-chi-sim",
    # Screen recording while a macro runs. gpu-screen-recorder is not packaged
    # for Debian, so only the other one is named here.
    "wf-recorder",
    "wl-clipboard",
]

maintainer-scripts = "packaging/debian"

# A transcription of the PKGBUILD's `package()`. A trailing slash means "into
# this directory, keeping the name"; no slash renames. The mode is an octal
# string, not a number.
assets = [
    ["target/release/clickwork", "usr/bin/", "755"],
    ["packaging/arch/io.github.blackixxce12.clickwork.desktop", "usr/share/applications/", "644"],
    ["assets/icon_128.png", "usr/share/icons/hicolor/128x128/apps/clickwork.png", "644"],
    ["assets/icon_256.png", "usr/share/icons/hicolor/256x256/apps/clickwork.png", "644"],
    ["assets/icon_512.png", "usr/share/icons/hicolor/512x512/apps/clickwork.png", "644"],
    # The same directory dh_installudev uses.
    ["packaging/arch/70-clickwork-input.rules", "usr/lib/udev/rules.d/", "644"],
    # Named one by one rather than globbed: `*.md` would sweep up the working
    # notes, which are deliberately not in the repository, and TESTING.md.
    ["README.md", "usr/share/doc/clickwork/", "644"],
    ["README_RU.md", "usr/share/doc/clickwork/", "644"],
    ["LINUX.md", "usr/share/doc/clickwork/", "644"],
    ["LINUX_RU.md", "usr/share/doc/clickwork/", "644"],
    ["SCRIPTS.md", "usr/share/doc/clickwork/", "644"],
    ["SCRIPTS_RU.md", "usr/share/doc/clickwork/", "644"],
    ["PLATFORMS.md", "usr/share/doc/clickwork/", "644"],
    ["PLATFORMS_RU.md", "usr/share/doc/clickwork/", "644"],
    ["CHANGELOG.md", "usr/share/doc/clickwork/", "644"],
]

# ---------------------------------------------------------------------------
# The RPM (Fedora, RHEL, openSUSE). `cargo generate-rpm` builds it, after a
# release build, into target/generate-rpm/.
#
# cargo-generate-rpm rather than cargo-rpm: the latter was archived in 2022 and
# needs rpmbuild, which this tool does not. Same build-host rule as the .deb -
# see BUILDING.md - and the same binary goes in both packages, because glibc is
# backward compatible and nothing in the four libraries this links differs
# between distributions.
# ---------------------------------------------------------------------------
[package.metadata.generate-rpm]
name = "clickwork"
summary = "Macro recorder for Windows and Wayland, recording into image-matched steps"
license = "MIT"
url = "https://github.com/blackixxce12/clickwork"
# What moves on a rebuild of the same upstream version, the way pkgrel does for
# Arch. No `%{?dist}`: macros are not expanded here and the string would land in
# the header verbatim.
release = "1"

# The same transcription as the .deb above, but `dest` is absolute here and the
# table form is the only one accepted.
assets = [
    { source = "target/release/clickwork", dest = "/usr/bin/clickwork", mode = "755" },
    { source = "packaging/arch/io.github.blackixxce12.clickwork.desktop", dest = "/usr/share/applications/io.github.blackixxce12.clickwork.desktop", mode = "644" },
    { source = "assets/icon_128.png", dest = "/usr/share/icons/hicolor/128x128/apps/clickwork.png", mode = "644" },
    { source = "assets/icon_256.png", dest = "/usr/share/icons/hicolor/256x256/apps/clickwork.png", mode = "644" },
    { source = "assets/icon_512.png", dest = "/usr/share/icons/hicolor/512x512/apps/clickwork.png", mode = "644" },
    # `%{_udevrulesdir}` is the same path Arch uses. A package may not write to
    # /etc/udev/rules.d; that belongs to the administrator.
    { source = "packaging/arch/70-clickwork-input.rules", dest = "/usr/lib/udev/rules.d/70-clickwork-input.rules", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/clickwork/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/clickwork/README.md", mode = "644", doc = true },
    { source = "README_RU.md", dest = "/usr/share/doc/clickwork/README_RU.md", mode = "644", doc = true },
    { source = "LINUX.md", dest = "/usr/share/doc/clickwork/LINUX.md", mode = "644", doc = true },
    { source = "LINUX_RU.md", dest = "/usr/share/doc/clickwork/LINUX_RU.md", mode = "644", doc = true },
    { source = "SCRIPTS.md", dest = "/usr/share/doc/clickwork/SCRIPTS.md", mode = "644", doc = true },
    { source = "SCRIPTS_RU.md", dest = "/usr/share/doc/clickwork/SCRIPTS_RU.md", mode = "644", doc = true },
    { source = "PLATFORMS.md", dest = "/usr/share/doc/clickwork/PLATFORMS.md", mode = "644", doc = true },
    { source = "PLATFORMS_RU.md", dest = "/usr/share/doc/clickwork/PLATFORMS_RU.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/clickwork/CHANGELOG.md", mode = "644", doc = true },
]

# Same reasoning as the Debian postinst, and the same guard: without the socket
# check this fails an install inside a container.
post_install_script = """
if [ -S /run/udev/control ]; then
    udevadm control --reload-rules || :
    udevadm trigger --subsystem-match=input || :
fi
"""

# auto-req adds libc, libm, libgcc_s, libxkbcommon.so.0 and the glibc floor on
# its own. These are the dlopened ones it cannot see, plus two directory owners.
# `libglvnd-egl` and not `mesa-libEGL`: the latter provides only the vendor
# implementation libEGL_mesa.so.0, while libEGL.so.1 itself - the dispatcher the
# program opens - belongs to libglvnd-egl. On openSUSE that package is libglvnd.
[package.metadata.generate-rpm.requires]
libwayland-client = "*"
libwayland-egl = "*"
libglvnd-egl = "*"
dbus-libs = "*"
at-spi2-core = "*"
xdg-desktop-portal = "*"
fontconfig = "*"
hicolor-icon-theme = "*"
systemd-udev = "*"

[package.metadata.generate-rpm.recommends]
tesseract-libs = "*"
tesseract-langpack-eng = "*"
google-noto-sans-cjk-fonts = "*"

[package.metadata.generate-rpm.suggests]
hyprland = "*"
xdg-desktop-portal-hyprland = "*"
xdg-desktop-portal-wlr = "*"
xdg-desktop-portal-gnome = "*"
xdg-desktop-portal-kde = "*"
tesseract-langpack-rus = "*"
tesseract-langpack-ukr = "*"
tesseract-langpack-por = "*"
tesseract-langpack-spa = "*"
tesseract-langpack-chi_sim = "*"
wf-recorder = "*"
wl-clipboard = "*"
